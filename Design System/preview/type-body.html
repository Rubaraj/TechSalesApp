<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .spec{ display:flex; flex-direction:column; gap:11px; max-width:560px; }
  .line{ display:flex; align-items:baseline; gap:14px; }
  .tag{ font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); width:96px; flex:none; }
</style></head>
<body>
  <div class="spec">
    <div class="line"><span class="tag">body · 15/400</span>
      <span style="font-size:15px;line-height:1.55">Searching the lead book. Click any leadId to drill in, Mike.</span></div>
    <div class="line"><span class="tag">body · 15/600</span>
      <span style="font-size:15px;font-weight:600">View Details</span></div>
    <div class="line"><span class="tag">sm · 13</span>
      <span style="font-size:13px;color:var(--fg-muted)">Age: 95 · MBI · Created Jan 2, 2026</span></div>
    <div class="line"><span class="tag">xs · 12</span>
      <span style="font-size:12px;color:var(--fg-muted)">Continuing your previous conversation · 1 turn</span></div>
  </div>
</body></html>
