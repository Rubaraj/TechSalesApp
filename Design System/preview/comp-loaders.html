<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  body{ padding:20px; display:flex; align-items:center; gap:48px; }
  .group{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .lbl{ font-size:11px; color:var(--fg-muted); }

  /* AI thinking — 3 dots */
  .thinking{ display:flex; align-items:center; gap:7px; background:var(--surface-3);
    padding:12px 16px; border-radius:14px 14px 14px 4px; }
  .thinking span{ width:8px; height:8px; border-radius:50%; background:var(--fg-muted);
    animation:blink 1.4s var(--ease-soft) infinite both; }
  .thinking span:nth-child(2){ animation-delay:.2s; }
  .thinking span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0); }
    40%{ opacity:1; transform:translateY(-3px); } }

  /* Connecting — calm ring */
  .spinner{ width:46px; height:46px; border-radius:50%;
    border:3px solid var(--surface-4); border-top-color:var(--exl-orange);
    animation:spin 1.5s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner,.thinking span{ animation:none; } }
</style></head>
<body>
  <div class="group">
    <div class="thinking"><span></span><span></span><span></span></div>
    <span class="lbl">Atlas is thinking</span>
  </div>
  <div class="group">
    <div class="spinner"></div>
    <span class="lbl">Dialer connecting…</span>
  </div>
</body></html>
