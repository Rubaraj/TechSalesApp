<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{ padding:14px; }
  .card{ background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:18px; max-width:340px; box-shadow:var(--shadow-md); }
  .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .nm{ font-size:17px; font-weight:700; }
  .age{ font-size:12.5px; color:var(--fg-muted); margin-top:2px; }
  .st{ font-size:11.5px; font-weight:700; color:var(--st-contacted); }
  .src{ display:inline-block; margin-top:8px; font-size:11px; font-weight:600;
    background:var(--tag-neutral-bg); color:var(--tag-neutral-fg); padding:3px 9px; border-radius:999px; }
  .rows{ margin:14px 0 12px; display:flex; flex-direction:column; gap:8px; }
  .r{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--fg-muted); }
  .r svg{ width:15px; height:15px; color:var(--fg-subtle); }
  .tags{ display:flex; gap:9px; }
  .tag{ font-size:11px; font-weight:700; }
  .mbi{ font-family:var(--font-mono); font-size:12px; color:var(--fg-muted); }
</style></head>
<body>
  <div class="card">
    <div class="top">
      <div><div class="nm">Dorothy Roberts</div>
        <div class="age">Age: 95 · <span class="mbi">MBI 4QV-20-1TSU</span></div></div>
      <div class="st">Contacted Lead</div>
    </div>
    <span class="src">Referral</span>
    <div class="rows">
      <div class="r"><i data-lucide="phone"></i> (499) 983-1255</div>
      <div class="r"><i data-lucide="mail"></i> dorothy.roberts356@hotmail.com</div>
      <div class="r"><i data-lucide="map-pin"></i> Austin, NM 89101</div>
    </div>
    <div class="tags"><span class="tag" style="color:var(--tag-dual)">Dual Eligible</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
