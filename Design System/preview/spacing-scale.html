<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .scale{ display:flex; gap:14px; align-items:flex-end; }
  .s{ display:flex; flex-direction:column; align-items:center; gap:7px; }
  .bar{ background:var(--exl-orange); border-radius:3px; width:18px; }
  .nm{ font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); }
</style></head>
<body>
  <div class="cap" style="margin-bottom:14px;">Spacing scale — 4px base</div>
  <div class="scale">
    <div class="s"><div class="bar" style="height:4px"></div><span class="nm">1·4</span></div>
    <div class="s"><div class="bar" style="height:8px"></div><span class="nm">2·8</span></div>
    <div class="s"><div class="bar" style="height:12px"></div><span class="nm">3·12</span></div>
    <div class="s"><div class="bar" style="height:16px"></div><span class="nm">4·16</span></div>
    <div class="s"><div class="bar" style="height:20px"></div><span class="nm">5·20</span></div>
    <div class="s"><div class="bar" style="height:24px"></div><span class="nm">6·24</span></div>
    <div class="s"><div class="bar" style="height:32px"></div><span class="nm">8·32</span></div>
    <div class="s"><div class="bar" style="height:40px"></div><span class="nm">10·40</span></div>
    <div class="s"><div class="bar" style="height:48px"></div><span class="nm">12·48</span></div>
    <div class="s"><div class="bar" style="height:64px"></div><span class="nm">16·64</span></div>
  </div>
</body></html>
