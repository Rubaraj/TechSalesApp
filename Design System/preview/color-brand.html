<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .chips{ display:flex; gap:14px; align-items:flex-end; }
  .chip{ width:120px; }
  .chip .sw{ height:64px; border-radius:12px; border:1px solid var(--border); }
  .name{ font-size:12.5px; font-weight:600; margin-top:8px; color:var(--fg); }
</style></head>
<body>
  <div class="chips">
    <div class="chip"><div class="sw" style="background:var(--exl-orange)"></div>
      <div class="name">Orange / accent</div><div class="tk-val">#ea580c</div></div>
    <div class="chip"><div class="sw" style="background:var(--exl-orange-bright)"></div>
      <div class="name">Bright / hover</div><div class="tk-val">#f97316</div></div>
    <div class="chip"><div class="sw" style="background:var(--exl-orange-press)"></div>
      <div class="name">Press</div><div class="tk-val">#c2410c</div></div>
    <div class="chip"><div class="sw" style="background:var(--exl-orange-soft);border-color:var(--exl-orange-line)"></div>
      <div class="name">Soft fill</div><div class="tk-val">rgba .12</div></div>
    <div class="chip"><div class="sw" style="background:linear-gradient(145deg,var(--atlas-from),var(--atlas-to))"></div>
      <div class="name">Atlas gradient</div><div class="tk-val">#fb923c→#ea580c</div></div>
  </div>
</body></html>
