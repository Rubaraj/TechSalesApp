<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{ padding:16px 18px; }
  .chat{ display:flex; flex-direction:column; gap:12px; max-width:420px; }
  .user{ align-self:flex-end; background:var(--exl-orange); color:#fff; font-weight:600;
    font-size:14px; padding:10px 15px; border-radius:14px 14px 4px 14px; box-shadow:var(--shadow-sm); }
  .ai{ display:flex; gap:10px; align-items:flex-start; }
  .mark{ width:26px; height:26px; flex:none; border-radius:8px; display:grid; place-items:center;
    background:linear-gradient(145deg,var(--atlas-from),var(--atlas-to)); color:#fff; margin-top:1px; }
  .mark svg{ width:15px; height:15px; }
  .ai .lines{ display:flex; flex-direction:column; gap:6px; font-size:14px;
    line-height:1.5; color:var(--fg); }
  .ai .lines .muted{ color:var(--fg-muted); }
</style></head>
<body>
  <div class="chat">
    <div class="user">Find leads in Florida that need follow-up</div>
    <div class="ai">
      <div class="mark"><i data-lucide="sparkles"></i></div>
      <div class="lines">
        <span class="muted">Searching the lead book…</span>
        <span>No matching leads.</span>
        <span>Click any leadId to drill in, Mike.</span>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
