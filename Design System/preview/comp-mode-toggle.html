<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body{ padding:18px; display:flex; flex-direction:column; gap:16px; }
  .seg{ display:inline-flex; background:var(--surface-3); border:1px solid var(--border);
    border-radius:11px; padding:3px; gap:2px; }
  .seg button{ all:unset; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--fg-muted); padding:7px 15px; border-radius:8px; display:flex; align-items:center; gap:7px;
    transition:all var(--dur-fast) var(--ease); }
  .seg button svg{ width:14px; height:14px; }
  .seg button.on{ background:var(--exl-orange); color:#fff; box-shadow:var(--shadow-sm); }
  .hint{ font-size:11.5px; color:var(--fg-subtle); }
</style></head>
<body>
  <div class="seg">
    <button><i data-lucide="volume-x"></i> Silent</button>
    <button class="on"><i data-lucide="hand"></i> Assist</button>
    <button><i data-lucide="rocket"></i> Auto Pilot</button>
  </div>
  <span class="hint">Assist — Atlas suggests; you approve every action.</span>
  <script>lucide.createIcons();</script>
</body></html>
