<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="_card.css" />
<style>
  .spec{ display:flex; flex-direction:column; gap:12px; }
  .line{ display:flex; align-items:baseline; gap:14px; }
  .tag{ font-family:var(--font-mono); font-size:10px; color:var(--fg-subtle); width:88px; flex:none; }
  .mono{ font-family:var(--font-mono); color:var(--fg); }
  .pill{ font-family:var(--font-mono); background:var(--surface-3); border:1px solid var(--border);
    border-radius:6px; padding:2px 8px; font-size:13px; }
</style></head>
<body>
  <div class="cap" style="margin-bottom:12px;">System monospace — timers, IDs, dialer digits</div>
  <div class="spec">
    <div class="line"><span class="tag">MBI</span><span class="pill">4QV-20-1TSU</span>
      <span class="pill">B01-8U-MS9D</span></div>
    <div class="line"><span class="tag">leadId</span><span class="pill">LD-48213</span>
      <span class="mono" style="font-size:13px;color:var(--fg-muted)">tabular nums 0123456789</span></div>
    <div class="line"><span class="tag">call timer</span>
      <span class="mono" style="font-size:18px">00:14</span>
      <span class="tag" style="width:auto;">dialer</span>
      <span class="mono" style="font-size:20px;letter-spacing:.03em">(415) 555-1234</span></div>
  </div>
  <div style="margin-top:13px;font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)">ui-monospace · SF&nbsp;Mono · Menlo · Consolas — as shipped (no custom mono webfont)</div>
</body></html>
