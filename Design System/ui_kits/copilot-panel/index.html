<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EXL Medicare Hub — Atlas Copilot</title>
<link rel="stylesheet" href="kit.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  #root{ height:100vh; }
  .app{ height:100vh; display:flex; flex-direction:column; }
  .stage{ flex:1; min-height:0; display:flex; }
  .board{ flex:1; min-width:0; overflow-y:auto; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="LeadBoard.jsx"></script>
<script type="text/babel" src="Dialer.jsx"></script>
<script type="text/babel" src="AtlasChat.jsx"></script>
<script type="text/babel" src="CopilotPanel.jsx"></script>
<script type="text/babel" src="NewLeadForm.jsx"></script>

<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakRadio, TweakToggle } = window;

// Accent presets — each remaps the brand + Atlas gradient vars.
const ACCENTS = {
  '#ea580c': { name:'Orange',  from:'#fb923c', to:'#ea580c', bright:'#f97316', press:'#c2410c', rgb:'234,88,12' },
  '#2563eb': { name:'Blue',    from:'#60a5fa', to:'#2563eb', bright:'#3b82f6', press:'#1d4ed8', rgb:'37,99,235' },
  '#7c3aed': { name:'Violet',  from:'#a78bfa', to:'#7c3aed', bright:'#8b5cf6', press:'#6d28d9', rgb:'124,58,237' },
  '#0d9488': { name:'Teal',    from:'#2dd4bf', to:'#0d9488', bright:'#14b8a6', press:'#0f766e', rgb:'13,148,136' },
};

function applyAccent(hex){
  const a = ACCENTS[hex] || ACCENTS['#ea580c'];
  const r = document.documentElement.style;
  r.setProperty('--exl-orange', a.to);
  r.setProperty('--exl-orange-bright', a.bright);
  r.setProperty('--exl-orange-press', a.press);
  r.setProperty('--exl-orange-soft', `rgba(${a.rgb},0.12)`);
  r.setProperty('--exl-orange-line', `rgba(${a.rgb},0.32)`);
  r.setProperty('--atlas-from', a.from);
  r.setProperty('--atlas-to', a.to);
  r.setProperty('--atlas-glow', `rgba(${a.rgb},0.35)`);
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#ea580c",
  "bubbleStyle": "soft",
  "approvalStyle": "compact",
  "modeStyle": "pills",
  "serifGreeting": true,
  "dark": false
}/*EDITMODE-END*/;

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [dialerOn, setDialerOn] = React.useState(false);
  const [copilotOpen, setCopilotOpen] = React.useState(true);
  const [formOpen, setFormOpen] = React.useState(false);
  const [prefill, setPrefill] = React.useState('(415) 555-1234');

  React.useEffect(() => { applyAccent(t.accent); }, [t.accent]);
  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.dark ? 'dark' : 'light');
  }, [t.dark]);

  const onCall = (lead) => { setPrefill(lead.phone); setDialerOn(true); setCopilotOpen(true); };

  return (
    <div className="app">
      <Header
        theme={t.dark ? 'dark' : 'light'}
        onToggleTheme={() => setTweak('dark', !t.dark)}
        dialerOn={dialerOn}
        onToggleDialer={() => { setDialerOn(v => !v); setCopilotOpen(true); }}
        onOpenCopilot={() => setCopilotOpen(true)}
        copilotOpen={copilotOpen}
      />
      <div className="stage">
        <div className="board scroll">
          <LeadBoard onCall={onCall} onNewLead={() => setFormOpen(true)} />
        </div>
        {copilotOpen && (
          <CopilotPanel
            tweaks={t}
            dialerOn={dialerOn}
            onToggleDialer={() => setDialerOn(v => !v)}
            onClose={() => setCopilotOpen(false)}
            prefillNumber={prefill}
          />
        )}
      </div>

      {formOpen && <NewLeadForm onClose={() => setFormOpen(false)} />}

      <TweaksPanel>
        <TweakSection label="Atlas surface" />
        <TweakColor label="AI accent" value={t.accent}
          options={['#ea580c','#2563eb','#7c3aed','#0d9488']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakToggle label="Editorial serif greeting" value={t.serifGreeting}
          onChange={(v) => setTweak('serifGreeting', v)} />
        <TweakSection label="Components" />
        <TweakRadio label="Message bubbles" value={t.bubbleStyle}
          options={['filled','soft','outline']}
          onChange={(v) => setTweak('bubbleStyle', v)} />
        <TweakRadio label="Approval card" value={t.approvalStyle}
          options={['standard','bordered','compact']}
          onChange={(v) => setTweak('approvalStyle', v)} />
        <TweakRadio label="Mode toggle" value={t.modeStyle}
          options={['segmented','pills','icons']}
          onChange={(v) => setTweak('modeStyle', v)} />
        <TweakSection label="Theme" />
        <TweakToggle label="Dark mode" value={t.dark}
          onChange={(v) => setTweak('dark', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
